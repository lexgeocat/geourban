name: ci

# Gate principal de CI para el lado TS del repo.
# - Fase 11.3 del plan de optimización.
# - Disparadores: push y pull_request a `main`.
# - Cubre: install, lint, test (Vitest), y build de producción de Vite.
#   No cubre los tests de Rust (eso vive en `parity.yml`) ni la release
#   de Tauri (`release-tauri.yml`).
# - Side-effect: ningún job hace deploy ni publica artefactos.
# - Default branch es `main` (verificado con `git symbolic-ref refs/remotes/origin/HEAD`).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos mínimos: solo lectura del código fuente.
permissions:
  contents: read

# Cancelar corridas previas de la misma branch/PR cuando se pushea un
# commit nuevo — evita gastar minutos de CI en builds obsoletos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        # Cubre tipos sin generar dist; es ~2x más rápido que `npm run build`
        # y agarra la mayoría de los errores antes del bundle.
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (Vite, producción)
        run: npm run build