name: geometry-engine-parity
on: [push, pull_request]

jobs:
  ts-and-parity-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run parity:sync
      - run: npm test
      - name: fallar si parity:sync dejó el repo sucio
        run: git diff --exit-code -- src-tauri/crates/geourban-geo/tests/fixtures

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: fuzzing de geometria degenerada (Fase 2.6)
        run: npm run test:fuzz

  rust-parity:
    needs: ts-and-parity-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: instalar libgeos (requerida por geos-sys para geos-backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgeos-dev
      - name: test del crate sin GEOS
        run: |
          cd src-tauri
          cargo test -p geourban-geo
      - name: test del crate con GEOS
        env:
          # src-tauri/.cargo/config.toml inyecta rutas de vcpkg (Windows) con
          # force=false; como aca no estan definidas, hay que forzarlas a las
          # del sistema o geos-sys no encuentra pkg-config / libgeos.
          PKG_CONFIG: /usr/bin/pkg-config
          PKG_CONFIG_PATH: /usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/x86_64-linux-gnu/pkgconfig
        run: |
          cd src-tauri
          cargo test -p geourban-geo --features geos-backend
