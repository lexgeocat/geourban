# Cargo config para habilitar el backend GEOS de `geourban-geo`.
#
# Requiere que vcpkg tenga libgeos instalado para el target
# `x64-windows-static-md` (librerías estáticas, CRT DINÁMICO — igual que
# Rust por defecto en msvc; evita el mismatch de CRT que rompía el link
# con `x64-windows-static`, que usa CRT estático /MT):
#
#     cd C:\vcpkg
#     .\vcpkg install geos:x64-windows-static-md
#     .\vcpkg install pkgconf:x64-windows-static-md
#
# Si vcpkg vive en otra ruta de tu sistema, editá `VCPKG_INSTALLED` abajo.
# Aplica solo al workspace de `src-tauri/` (es un `.cargo/config.toml` scoped
# a este subdirectorio, no se filtra al frontend).

[env]
# Path donde vcpkg deja headers + libs despues de `vcpkg install geos:x64-windows-static-md`.
# Por convencion de vcpkg: <VCPKG_ROOT>/installed/<TARGET>/...
VCPKG_INSTALLED = { value = "x64-windows-static-md", force = false }
# `cc` (la crate que `geos-sys` usa internamente para compilar wrappers C)
# respeta CPATH en unix y Windows. Lo seteamos para que encuentre
# `geos_c.h` sin tener que patchear el build script de la crate.
CPATH = { value = "C:\\vcpkg\\installed\\x64-windows-static-md\\include", force = false }
# Cplusplus include path por si la crate intenta compilar algo C++.
CPLUS_INCLUDE_PATH = { value = "C:\\vcpkg\\installed\\x64-windows-static-md\\include", force = false }
# `geos-sys` usa pkg-config para localizar libgeos. vcpkg provee
# `pkgconf` (reemplazo drop-in de pkg-config). Apuntamos PKG_CONFIG
# al binario de vcpkg para no requerir pkg-config en PATH.
PKG_CONFIG = { value = "C:\\vcpkg\\installed\\x64-windows-static-md\\tools\\pkgconf\\pkgconf.exe", force = false }
# pkgconf busca modulos `.pc` en PKG_CONFIG_PATH. vcpkg los deja en
# `<installed>/lib/pkgconfig` y `<installed>/share/pkgconfig`.
PKG_CONFIG_PATH = { value = "C:\\vcpkg\\installed\\x64-windows-static-md\\lib\\pkgconfig;C:\\vcpkg\\installed\\x64-windows-static-md\\share\\pkgconfig", force = false }
PKG_CONFIG_LIBDIR = { value = "C:\\vcpkg\\installed\\x64-windows-static-md\\lib\\pkgconfig", force = false }

[target.x86_64-pc-windows-msvc]
# El linker MSVC (`link.exe`) no busca por defecto en dirs no estandar.
# `-LIBPATH:` le suma un directorio de busqueda de .lib al link.
# Con el triplet `-static-md`, GEOS usa el mismo CRT dinámico que Rust:
# NO hace falta `/NODEFAULTLIB:LIBCMT` (ese flag excluía el CRT estático
# que la build `-static` SÍ necesitaba, dejando los símbolos de
# libcmt/libvcruntime sin resolver — los LNK2001 de `operator new`).
rustflags = [
    "-C", "link-arg=/LIBPATH:C:\\vcpkg\\installed\\x64-windows-static-md\\lib",
]
