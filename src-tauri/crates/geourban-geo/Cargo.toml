[package]
name = "geourban-geo"
version = "0.1.0"
edition = "2021"
description = "Motor de geometria nativo para GeoUrban — Fase 2 de auditoria-para-mejora.md"
license = "MIT"
publish = false

[lib]
name = "geourban_geo"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
rstar = "0.12"

geos = { version = "8", optional = true }

[features]
default = []
geos-backend = ["dep:geos"]