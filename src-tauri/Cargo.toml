[workspace]
members = ["crates/geourban-geo"]

[package]
name = "geourban"
version = "0.1.0"
description = "Editor CAD/GIS client-side para planificación urbana"
authors = ["GeoUrban Contributors"]
license = "MIT"
repository = "https://github.com/anomalyco/geourban"
edition = "2021"
rust-version = "1.77.2"
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
geourban-geo = { path = "crates/geourban-geo", features = ["geos-backend"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
